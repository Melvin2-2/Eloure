# Baut die Website bei jedem Push und veröffentlicht sie auf GitHub Pages (Branch gh-pages).
# Adresse: https://melvin2-2.github.io/Eloure/
name: Website veröffentlichen

on:
  push:
    branches: [main, master, claude/ecstatic-goodall-4atxh1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-relative
          publish_branch: gh-pages
          force_orphan: true
